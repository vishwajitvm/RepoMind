name: "Feature Request"
description: "Suggest an idea, enhancement, or new feature for RepoMind."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions that align with RepoMind's focus: small, professional, token-efficient AI codebase intelligence with zero fabricated functionality.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - "Code Parsing & AST Chunking"
        - "LLM Router / Fallback Providers"
        - "Embeddings / Vector Retrieval"
        - "GitHub MCP Tooling"
        - "LangGraph Agent Workflows"
        - "Frontend UI / Storybook Components"
        - "Observability / Tracing"
        - "DevOps / Infrastructure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like RepoMind to do and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
