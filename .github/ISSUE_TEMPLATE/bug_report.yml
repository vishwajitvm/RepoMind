name: "Bug Report"
description: "File a bug or error encountered while running RepoMind."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Before opening an issue, please ensure that all Docker containers are healthy (`docker compose ps`) and verify whether the issue is reproducible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the RepoMind subsystem where the issue occurred.
      options:
        - "Frontend (React / Tailwind UI)"
        - "Storybook Catalog"
        - "Backend REST API (FastAPI)"
        - "Background Worker / Indexer"
        - "LangGraph Orchestrator / Chat"
        - "Qdrant Vector Retrieval"
        - "GitHub MCP Integration"
        - "TraceNest Observability"
        - "Docker / Environment Setup"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise explanation of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Register repository '...'
        2. Dispatch indexing via POST /api/repositories/{id}/index
        3. Send chat query '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Traces
      description: Paste relevant Docker logs (`docker compose logs backend`) or TraceNest events from `http://localhost:8000/tracenest`. (Ensure no API keys or secrets are included!)
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Runtime Environment
      options:
        - "Docker Compose (Standard 9-service stack)"
        - "Local Bare-Metal Development"
        - "Cloud / Kubernetes Deployment"
    validations:
      required: true
